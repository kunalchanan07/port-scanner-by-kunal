[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Netlify API Reverse Proxy: forwards any /api/* calls to Render FastAPI backend
[[redirects]]
  from = "/api/*"
  to = "https://port-scanner-by-kunal.onrender.com/api/:splat"
  status = 200
  force = true

# Redirects for Single Page Application (SPA) routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
