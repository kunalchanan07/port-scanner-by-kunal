[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Optional: Netlify API Reverse Proxy (uncomment if not using direct CORS URL in VITE_API_BASE_URL)
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR_BACKEND_URL.onrender.com/api/:splat"
#   status = 200
#   force = true

# Redirects for Single Page Application (SPA) routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
